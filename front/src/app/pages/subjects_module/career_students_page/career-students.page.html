<div class="m-w-custom">
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

  <div class="surface-card border-round p-4 mb-4">
    <h2 class="m-0">Alumnos de la carrera</h2>
    <p class="m-0 text-color-secondary">
      Administra el acceso y estado de los estudiantes inscriptos en la carrera.
    </p>
  </div>

  <ng-container *ngIf="loading(); else loadedTpl">
    <div class="center">
      <p-progressSpinner ariaLabel="Cargando"></p-progressSpinner>
    </div>
  </ng-container>

  <ng-template #loadedTpl>
    <div *ngIf="error(); else contentTpl" class="error">{{ error() }}</div>
  </ng-template>

  <ng-template #contentTpl>
    <div class="table-container surface-card border-round p-1">
      <p-table
        [value]="filteredRows()"
        [paginator]="true"
        [rows]="15"
        [sortField]="'user.fullName'"
        [sortOrder]="1"
        dataKey="studentId"
        responsiveLayout="scroll"
        styleClass="p-datatable-sm p-datatable-gridlines"
        [rowTrackBy]="rowsTrackBy"
        #studentsTable
      >
        <ng-template pTemplate="caption">
          <div class="flex justify-content-between align-items-center">
            <div class="flex gap-2">
              <input
                pInputText
                [ngModel]="search()"
                (ngModelChange)="onSearchChange($event)"
                placeholder="Buscar por nombre, CUIL o email"
                style="min-width: 18rem"
              />
              <p-button
                label="Exportar CSV"
                icon="pi pi-download"
                [outlined]="true"
                (onClick)="studentsTable.exportCSV({ selectionOnly: false })"
              ></p-button>
              <!-- hacer un select con dropdown aca -->
              <!-- <input
                pInputText
                type="number"
                [ngModel]="year()"
                (ngModelChange)="year.set($event ? +$event : null)"
                placeholder="Año ingreso (ej: 2026)"
                style="width: 12rem"
              />
              <p-button
                label="Aplicar año"
                icon="pi pi-filter"
                (onClick)="onApplyYearFilter()"
                [disabled]="loading()"
              ></p-button> -->
            </div>
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="commissionLetter">
              Comision <p-sortIcon field="commissionLetter" />
            </th>
            <th pSortableColumn="user.fullName">
              Alumno <p-sortIcon field="user.fullName" />
            </th>
            <th pSortableColumn="user.email">
              Email <p-sortIcon field="user.email" />
            </th>
            <th style="width: 12rem">Acciones</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
          <tr class="tr-container">
            <td class="w-1rem text-center">
              {{ row.commissionLetter || row.commissionId }}
            </td>
            <td class="alumno-cell max-w-10rem">
              <div class="flex flex-column">
                <span class="font-medium">{{ row.user.fullName }}</span>
                <small class="text-color-secondary"
                  >CUIL: {{ row.user.dni }}</small
                >
              </div>
            </td>
            <td>{{ row.user.email }}</td>
            <td class="text-center">
              <button
                pButton
                type="button"
                icon="pi pi-user"
                label="Ver ficha"
                (click)="viewStudent(row.studentId)"
                [text]="true"
              ></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </ng-template>
</div>

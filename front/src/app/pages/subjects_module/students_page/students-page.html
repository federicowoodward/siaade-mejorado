<div class="m-w-custom">
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

  <h2 class="my-3">Estudiantes de la materia</h2>
  <!-- accesible desde listado de materias -->
  <app-users-table
    [viewerRole]="viewerRole ?? ROLE.TEACHER"
    [context]="'subject-students'"
    [roleFilterEnabled]="false"
    [rows]="rows()"
    (rowAction)="onRowAction($event)"
  />
</div>

<div class="m-w-custom px-3 md:px-0">
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
  <div
    class="surface-card shadow-2 border-round p-4 flex justify-content-between align-content-center"
  >
    <div>
      <h2 class="mb-2">Gestión de Materias</h2>
      <p>Gestiona las materias, alumnos y sus comisiones.</p>
    </div>
    <p-button
      *ngIf="!isTeacher"
      (onClick)="goToCareerInfo()"
      icon="pi pi-info-circle"
      severity="secondary"
      label="Información de la carrera"
    ></p-button>
  </div>
  <div class="flex justify-content-end mb-3 gap-3">
    <div class="flex align-items-center gap-2">
      <label for="subjectYearFilter" class="font-medium">A�o</label>
      <select
        id="subjectYearFilter"
        class="p-inputtext p-component"
        [value]="selectedYear() ?? ''"
        (change)="onYearFilterChange($event)"
      >
        <option value="">Todas</option>
        <ng-container *ngFor="let year of availableYears()">
          <option [value]="year">{{ year }}� a�o</option>
        </ng-container>
      </select>
    </div>
    <!-- <p-button
      (onClick)="goToNewSubject()"
      icon="pi pi-plus"
      label="Nueva materia"
      variant="outlined"
    ></p-button> -->
  </div>
  <div class="surface-card border-round p-1">
    <app-subjects-table></app-subjects-table>
  </div>
</div>

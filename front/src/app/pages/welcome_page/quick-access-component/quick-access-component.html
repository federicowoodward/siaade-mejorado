<!-- Accesos rápidos -->
<div class="grid quick-access">
  <div *ngFor="let acc of accesses()" class="col-12 lg:col-6">
    <ng-container
      *ngIf="!(isStudentCertificate(acc) && loadingStudentCertificate()); else loadingCard"
    >
      <p-card
        [header]="acc.label"
        [subheader]="acc.description"
        [style]="{ cursor: 'pointer' }"
        (click)="acc.route ? navigate(acc.route) : acc.action?.()"
        class="quick-card"
      >
        <ng-template #header>
          <i [class]="acc.icon + ' text-4xl text-primary pb-3'"></i>
        </ng-template>
      </p-card>
    </ng-container>

    <ng-template #loadingCard>
      <p-card header="Generando certificado..." class="quick-card loading-card">
        <ng-template #header>
          <i [class]="acc.icon + ' text-4xl text-primary pb-3'"></i>
        </ng-template>
        <p-progress-spinner
          ariaLabel="loading"
          strokeWidth="3"
          [style]="{ width: '45px', height: '45px' }"
        />
      </p-card>
    </ng-template>
  </div>
</div>

<!-- Banner principal -->
<div
  class="banner h-10rem flex align-items-center px-4 md:px-6 bg-primary text-black"
>
  <div class="flex align-items-center gap-3">
    <div class="custom-color-text">
      <h1 class="text-4xl font-bold">Instituto Cura Gabriel Brochero</h1>
      <p class="text-xl opacity-80">Gestión simple, acceso rápido</p>
    </div>
  </div>

</div>

<!-- CONTENEDOR 50/50 DESKTOP — 1 COL MOBILE -->

  <div class="col-12 md:col-6 p-4 lg:px-6">
    <app-quick-access></app-quick-access>
  </div>

  <!-- Important Notices -->
  <div class="col-12 md:col-6 px-4 lg:px-6">
    <app-important-notices></app-important-notices>
  </div>
</div>

<!-- Modal de cambio de contraseña obligatorio -->

></app-first-password-change-modal>

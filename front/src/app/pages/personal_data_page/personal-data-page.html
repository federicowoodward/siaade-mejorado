<div class="m-w-custom flex flex-column gap-3 pt-4">
  <div
    class="flex flex-column md:flex-row md:align-items-center justify-content-between gap-3"
  >
    <div class="flex flex-column gap-1">
      <h2 class="m-0">Datos personales</h2>
      <p class="m-0 text-color-secondary">
        Revisá que tu información esté actualizada para agilizar las gestiones
        académicas.
      </p>
    </div>
    <div class="flex justify-content-end">
      <p-button
        label="Cambiar contraseña"
        icon="pi pi-key"
        routerLink="/account/password/change-request"
        styleClass="p-button-outlined"
      ></p-button>
    </div>
  </div>

  <app-personal-data *ngIf="userId" [userId]="userId"></app-personal-data>
</div>

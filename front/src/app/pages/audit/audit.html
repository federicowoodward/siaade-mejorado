<div class="p-3 flex flex-column gap-3 m-w-custom">
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
  <div class="surface-card border-round p-4 pb-3">
    <h2 class="m-0 text-2xl font-semibold">Auditoría de alertas</h2>
    <p class="m-0 text-color-secondary">
      Últimas alertas disparadas desde la interfaz.
    </p>
  </div>

  <div *ngIf="error(); else tableBlock" class="p-3 border-round bg-red-50">
    <p class="m-0 text-red-800 font-semibold">Error al cargar las alertas</p>
    <p class="m-0 text-red-700 text-sm">{{ error() }}</p>
  </div>

  <ng-template #tableBlock>
    <div
      *ngIf="loading(); else contentBlock"
      class="flex justify-content-center py-5"
    >
      <p-progressSpinner strokeWidth="3"></p-progressSpinner>
    </div>

    <ng-template #contentBlock>
      <p-table
        [value]="rows()"
        [tableStyle]="{ 'min-width': '60rem' }"
        styleClass="p-datatable-sm"
      >
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 11rem">Fecha</th>
            <th style="width: 7rem">Severidad</th>
            <th>Mensaje</th>
            <th style="width: 12rem">Acción</th>
            <th style="width: 11rem">Usuario</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td>{{ row.createdAtLabel }}</td>
            <td>
              <p-tag
                [value]="row.severity"
                [severity]="row.severityTag"
              ></p-tag>
            </td>
            <td>
              <span class="text-sm">{{ row.message }}</span>
            </td>
            <td>
              <span class="text-xs">{{ row.action || '-' }}</span>
            </td>
            <td>
              <span class="text-xs">{{ row.userId || '-' }}</span>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="7" class="text-center text-color-secondary py-4">
              No se encontraron alertas registradas.
            </td>
          </tr>
        </ng-template>
      </p-table>

      <div class="flex justify-content-end mt-3">
        <p-paginator
          [rows]="20"
          [totalRecords]="total() > 200 ? 200 : total()"
          [first]="(page() - 1) * 20"
          [rowsPerPageOptions]="[20]"
          (onPageChange)="onPageChange($event)"
        ></p-paginator>
      </div>
    </ng-template>
  </ng-template>
</div>
